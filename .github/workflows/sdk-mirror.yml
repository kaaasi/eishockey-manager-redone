# Legt das offizielle .NET-SDK (Linux x64) als Release-Datei im Repo ab.
# Hintergrund: Die Arbeitsumgebung von Claude erreicht die Microsoft-Downloadserver nicht,
# GitHub-Releases aber schon. Die Datei wird hier direkt von Microsoft geladen und
# gegen die offizielle SHA-512-Prüfsumme geprüft. Wird nur manuell gestartet.
name: SDK-Spiegel für Claude

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Neueste SDK-Version ermitteln und laden
        id: sdk
        run: |
          set -euo pipefail
          META=$(curl -fsSL https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json)
          VER=$(echo "$META" | jq -r '."latest-sdk"')
          FILE=$(echo "$META" | jq -c --arg v "$VER" '[.releases[] | .sdks[]? // .sdk | select(.version==$v) | .files[] | select(.name=="dotnet-sdk-linux-x64.tar.gz")][0]')
          URL=$(echo "$FILE" | jq -r .url)
          HASH=$(echo "$FILE" | jq -r .hash)
          echo "SDK $VER: $URL"
          curl -fsSL -o dotnet-sdk-linux-x64.tar.gz "$URL"
          echo "$HASH  dotnet-sdk-linux-x64.tar.gz" | sha512sum -c -
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Als Release ablegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="dotnet-sdk-${{ steps.sdk.outputs.version }}"
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dotnet-sdk-linux-x64.tar.gz -R "$GITHUB_REPOSITORY" \
            --prerelease --title ".NET SDK ${{ steps.sdk.outputs.version }} (Werkzeug)" \
            --notes "Offizielles .NET SDK von Microsoft, ungeändert (SHA-512 geprüft). Nur für die Arbeitsumgebung von Claude; kann jederzeit gelöscht werden."
