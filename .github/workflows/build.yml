name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EishockeyManager.slnx

      - name: Build
        run: dotnet build EishockeyManager.slnx -c Release --no-restore

      - name: Test
        run: dotnet test EishockeyManager.slnx -c Release --no-build --verbosity normal
