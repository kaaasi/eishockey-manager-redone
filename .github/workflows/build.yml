name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:   # „Run workflow“ in Actions: baut zusätzlich die Downloads (Job publish)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versionen festgeschrieben (global.json, Paketversionen)
        run: python3 .github/scripts/versionen_pruefen.py .

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json   # SDK-Version fest in global.json (A09)

      - name: Restore
        run: dotnet restore EishockeyManager.slnx

      # Warnungen gelten als Fehler: main und alle offenen PRs bauen ohne Warnung (Stand 27.10.2026).
      - name: Build
        run: dotnet build EishockeyManager.slnx -c Release --no-restore -warnaserror

      # Getrennte Läufe: synthetische Tests und Tests mit Originaldaten (Trait Category=Originaldaten).
      # Ohne Originaldateien (hier immer) meldet der zweite Lauf echte Skips; der Bericht zeigt sie sichtbar an.
      - name: Test (synthetisch)
        run: >
          dotnet test EishockeyManager.slnx -c Release --no-build --verbosity normal
          --filter "Category!=Originaldaten" --logger "trx;LogFilePrefix=synthetisch" --results-directory TestResults/synthetisch

      - name: Test (Originaldaten)
        if: success() || failure()
        run: >
          dotnet test EishockeyManager.slnx -c Release --no-build --verbosity normal
          --filter "Category=Originaldaten" --logger "trx;LogFilePrefix=originaldaten" --results-directory TestResults/originaldaten

      - name: Testbericht
        if: success() || failure()
        run: python3 .github/scripts/testbericht.py TestResults   # schreibt selbst in $GITHUB_STEP_SUMMARY, Annotationen ins Log

      # Marker-Zählung je Projekt (tools/markerbericht.py) an die Zusammenfassung anhängen.
      - name: Markerbericht
        if: success() || failure()
        run: python3 tools/markerbericht.py >> "$GITHUB_STEP_SUMMARY"

  # Lauffähige Zwischenstände zum Herunterladen (Actions → Lauf → Artifacts).
  # Die Originaldateien müssen daneben im Ordner "gamedata" liegen.
  # Nur auf Anforderung (workflow_dispatch) oder bei Versions-Tags v*: Jeder Push auf main erzeugte sonst
  # 3 × ~36 MB, bei 14 Tagen Aufbewahrung weit über den 500 MB Artefakt-Speicher von GitHub Free.
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json   # SDK-Version fest in global.json (A09)

      - name: Veröffentlichen
        run: |
          dotnet publish src/EishockeyManager.Desktop -c Release -r ${{ matrix.rid }} --self-contained -o out
          dotnet publish src/EishockeyManager.Tools -c Release -r ${{ matrix.rid }} --self-contained -o out

      - uses: actions/upload-artifact@v4
        with:
          name: EishockeyManager-${{ matrix.rid }}-${{ github.sha }}
          path: out
          retention-days: 7
